<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cognify — the fun, focused way to learn anything</title>
  <meta name="description" content="Pick any topic and Cognify turns it into a path of short lessons, quizzes and coding practice, with an AI tutor beside you." />
  <meta name="theme-color" content="#6c56ff" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script>
    // Apply the saved theme before first paint so there is no flash.
    try {
      var t = localStorage.getItem('cognify_theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
