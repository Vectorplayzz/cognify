# Cognify — static frontend + API reverse proxy.
# Repo copy: /var/www/cognify/deploy/nginx/cognify.ourspaces.net.conf (keep in sync).
server {
    server_name cognify.ourspaces.net;

    root /var/www/cognify/dist;
    index index.html;
    charset utf-8;
    server_tokens off;

    include /etc/nginx/snippets/cognify-security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Hashed build assets never change, so they can be cached forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        include /etc/nginx/snippets/cognify-security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy. The Node API owns auth, validation and rate limiting.
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        # Notes accept up to 5 files x 10 MB (multer); nginx's 1 MB default
        # rejected any PDF larger than that before it reached the API.
        client_max_body_size 55m;
        # LLM responses are streamed as server-sent events.
        proxy_buffering off;
    }

    # Ollama, Piston and the legacy vector service are deliberately NOT
    # proxied. The browser reaches them only through /api, which requires
    # a signed-in user. (/llm-api, /ollama-stream and /vector-api were
    # removed: they exposed those services without authentication.)

    # index.html must revalidate, or browsers keep an old build that points
    # at asset hashes that no longer exist.
    location = /index.html {
        include /etc/nginx/snippets/cognify-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # All other routes go to index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/cognify.ourspaces.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cognify.ourspaces.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name cognify.ourspaces.net;
    return 301 https://$host$request_uri;
}
